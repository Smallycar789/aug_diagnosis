experiment:
  name: resnet_sifuqi
  seed: 0
  device: auto
output:
  root: outputs/diagnosis
dataset:
  name: sifuqi
  root: data/sifuqi
  csv: servo_accuracy.csv
  time_column: hours
  value_columns:
  - servo_accuracy
  normal_time_max: 1000
  fault_time_min: 6000
  label_names:
  - normal
  - tracking_fault
  sample_length: 64
  stride: 8
  normalize: per_window
  stft_input: channel
model:
  name: resnet
  sample_len: 64
  nperseg: 32
  noverlap: 16
  nfft: 256
  target_size: 224
  batch_size: 8
  epochs: 60
  lr: 0.0003
  weight_decay: 0.005
  num_classes: 2
  train_ratio: 0.7
  val_ratio: 0.15
  freeze_layers: true
