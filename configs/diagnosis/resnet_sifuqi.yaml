experiment:
  name: resnet_sifuqi_v1
  seed: 42
  device: auto

output:
  root: outputs/diagnosis

dataset:
  name: sifuqi
  root: data/sifuqi
  value_columns:
    - azimuth_error
    - pitch_error
  sample_length: 512
  stride: 64
  whole_file_as_series: true
  normalize: per_window
  levels:
    normal: servo_normal.csv
    mild: servo_mild.csv
    moderate: servo_moderate.csv
    severe: servo_severe.csv

model:
  name: resnet
  sample_len: 1024
  nperseg: 64
  noverlap: 32
  nfft: 224
  target_size: 224
  batch_size: 32
  epochs: 30
  lr: 0.001
  num_classes: 4
  train_ratio: 0.6
  val_ratio: 0.2
  freeze_layers: true
