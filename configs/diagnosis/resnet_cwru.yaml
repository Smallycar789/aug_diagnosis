experiment:
  name: resnet_cwru_v1
  seed: 42
  device: auto

output:
  root: outputs/diagnosis

dataset:
  name: cwru_csv
  csv: data/CWRU/CWRU_12k_1797_10c.csv
  has_header: true

model:
  name: resnet
  sample_len: 1024
  nperseg: 64
  noverlap: 32
  nfft: 224
  target_size: 224
  batch_size: 32
  epochs: 30
  lr: 0.001
  num_classes: 10
  train_ratio: 0.6
  val_ratio: 0.2
  freeze_layers: true
