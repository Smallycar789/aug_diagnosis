experiment:
  name: cnn_bigru_cwru_v1
  seed: 42
  device: auto

output:
  root: outputs/diagnosis

dataset:
  name: cwru_csv
  source_csv: CWRU_12k_1797_10c.csv
  target_csv: CWRU_12k_1750_10c.csv
  sample_length: 1024
  stride: 512
  val_ratio: 0.2

model:
  name: cnn_bigru
  input_channels: 1
  num_classes: 10
  sample_length: 1024
  hidden_dims: 64
  gru_hidden: 128
  num_layers: 2
  batch_size: 64
  epochs: 50
  alpha: 1.0
  lr: 0.0005
