experiment:
  name: resnet_cooler_v1
  seed: 42
  device: auto
output:
  root: outputs/diagnosis
dataset:
  name: cooler
  root: data/cooler
  simulation_csv: all_simulation.csv
  time_column: time_hours
  group_column: group_id
  value_columns:
  - T_stable_K
  - t_cool_s
  - sigma_T_K
  normal_time_max: 2000
  fault_time_min: 6000
  label_names:
  - normal
  - temperature_control_fault
  sample_length: 30
  stride: 15
model:
  name: resnet
  sample_len: 90
  nperseg: 64
  noverlap: 32
  nfft: 224
  target_size: 224
  batch_size: 8
  epochs: 30
  lr: 0.001
  num_classes: 2
  train_ratio: 0.6
  val_ratio: 0.2
  freeze_layers: true
