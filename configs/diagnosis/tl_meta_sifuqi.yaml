experiment:
  name: tl_meta_sifuqi_v1
  seed: 42
  device: auto

output:
  root: outputs/diagnosis

dataset:
  name: sifuqi
  root: data/sifuqi
  value_columns:
    - azimuth_error
    - pitch_error
  levels:
    normal: servo_normal.csv
    mild: servo_mild.csv
    moderate: servo_moderate.csv
    severe: servo_severe.csv
  whole_file_as_series: true
  sample_length: 256
  stride: 16
  merge_mode: flatten
  pad_to_length: 2048
  prenormalize: per_window

model:
  name: tl_meta
  n_way: 4
  n_support: 5
  n_unlabeled: 5
  n_query: 5
  n_episodes: 2000
  val_interval: 200
  test_episodes: 300
  embedding_dim: 128
  refine_iterations: 2
  samples_per_class: 120
  signal_length: 2048
  allow_episode_replace: true
  overlap: 0.5
  normalize: true
  train_ratio: 0.7
  val_ratio: 0.15
  l_skip: 0.2
  sgd_lr: 0.1
  adam_lr: 0.001
