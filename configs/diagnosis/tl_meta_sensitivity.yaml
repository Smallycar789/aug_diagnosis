experiment:
  name: tl_meta_sensitivity_v1
  seed: 42
  device: auto

output:
  root: outputs/diagnosis

dataset:
  name: sensitivity
  root: data/sensitivity
  value_columns:
    - avg_detectivity
    - NETD_mK
  class_files:
    normal: normal.csv
    sensitivity_degradation: sensitivity_degradation.csv
    coupled_severe_fault: coupled_severe_fault.csv
  unit_column: unit
  cycle_column: cycle
  # 与 CNN-BiGRU 对齐；2 通道 flatten=192，pad 至 encoder 输入 2048
  sample_length: 96
  stride: 32
  merge_mode: flatten
  pad_to_length: 2048
  prenormalize: per_window

model:
  name: tl_meta
  n_way: 3
  n_support: 5
  n_unlabeled: 5
  n_query: 5
  n_episodes: 2000
  val_interval: 200
  test_episodes: 300
  embedding_dim: 128
  refine_iterations: 2
  samples_per_class: 150
  signal_length: 2048
  overlap: 0.5
  normalize: true
  train_ratio: 0.7
  val_ratio: 0.15
  l_skip: 0.2
  sgd_lr: 0.1
  adam_lr: 0.001
