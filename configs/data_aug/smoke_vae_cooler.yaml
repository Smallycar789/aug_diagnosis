experiment:
  name: smoke_vae_cooler
  seed: 42
  device: cpu

output:
  root: outputs/data_aug

dataset:
  name: cooler
  root: data/cooler
  csv: all_simulation.csv
  time_column: time_hours
  group_column: group_id
  value_columns:
    - T_stable_K
    - t_cool_s
    - sigma_T_K
  normal_time_max: 2000
  fault_time_min: 6000
  label_names:
    - normal
    - temperature_control_fault
  sample_length: 128
  stride: 32
  sample_rate: 1.0

model:
  name: tvae
  conditional: true
  per_class_norm: true
  seq_len: 128
  stride: 32
  input_dim: 3
  latent_dim: 32
  hidden_dim: 128
  num_layers: 1
  epochs: 2
  batch_size: 256
  lr: 0.001
  phase1_tf_epochs: 1
  ramp_tfr_epochs: 1
  use_reference_kl_schedule: true
  beta_delay_frac: 0.42
  beta_end: 0.04
  num_generate_per_class: 25
