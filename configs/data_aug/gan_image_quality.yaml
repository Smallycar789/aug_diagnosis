experiment:
  name: gan_image_quality_v1
  seed: 42
  device: auto

output:
  root: outputs/data_aug

dataset:
  name: image_quality
  root: data/image_quality
  class_files:
    normal: normal.csv
    mtf_degradation: mtf_degradation.csv
    nonuniformity_degradation: nonuniformity_degradation.csv
    bad_pixel_degradation: bad_pixel_degradation.csv
    coupled_severe_fault: coupled_severe_fault.csv
  value_columns:
    - MTF50
    - response_nonuniformity
    - bad_pixel_rate
  unit_column: unit
  cycle_column: cycle
  sample_length: 32
  stride: 16
  sample_rate: 1.0

model:
  name: gan
  z_dim: 64
  window_size: 32
  step_length: 16
  epochs: 120
  batch_size: 16
  g_lr: 0.0005
  d_lr: 5.0e-05
  enc_lr: 0.0003
  recon_weight: 0.5
  per_class: true
  per_class_norm: true
  num_generate_per_class: 300
  num_compare: 5
  split_feature_plots: true
  eval_mmd_max_samples: 256
  spectrum_plot_style: vline
