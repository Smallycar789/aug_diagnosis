experiment:
  name: gan_vae_image_quality_v1
  seed: 42
  device: auto

output:
  root: outputs/data_aug

dataset:
  name: image_quality
  root: data/image_quality
  class_files:
    normal: normal.csv
    mtf_degradation: mtf_degradation.csv
    nonuniformity_degradation: nonuniformity_degradation.csv
    bad_pixel_degradation: bad_pixel_degradation.csv
    coupled_severe_fault: coupled_severe_fault.csv
  value_columns:
    - MTF50
    - response_nonuniformity
    - bad_pixel_rate
  unit_column: unit
  cycle_column: cycle
  sample_length: 32
  stride: 16
  sample_rate: 1.0

model:
  name: gan_vae
  per_class: true
  seq_len: 32
  overlap_ratio: 0.5
  input_channels: 3
  latent_dim: 32
  epochs: 120
  batch_size: 16
  lr: 0.0001
  alpha: 0.01
  num_generate_per_class: 300
