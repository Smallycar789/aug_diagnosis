experiment:
  name: gan_vae_cooler_v2
  seed: 42
  device: auto
output:
  root: outputs/data_aug
dataset:
  name: cooler
  root: data/cooler
  csv: all_simulation.csv
  time_column: time_hours
  group_column: group_id
  value_columns:
  - T_stable_K
  - t_cool_s
  - sigma_T_K
  normal_time_max: 2000
  fault_time_min: 6000
  label_names:
  - normal
  - temperature_control_fault
  sample_length: 128
  stride: 8
  sample_rate: 1.0
model:
  name: gan_vae
  per_class: true
  seq_len: 128
  overlap_ratio: 0.5
  input_channels: 3
  latent_dim: 24
  epochs: 150
  batch_size: 20
  drop_last: false
  lr: 0.0001
  g_lr: 0.0002
  d_lr: 3.0e-05
  recon_weight: 8.0
  adv_weight: 0.25
  mean_match_weight: 1.0
  random_mean_match_weight: 0.5
  trend_match_weight: 2.0
  alpha: 0.08
  feature_recon_weights:
    T_stable_K: 1.0
    t_cool_s: 3.0
    sigma_T_K: 2.0
  feature_mean_match_weights:
    T_stable_K: 1.0
    t_cool_s: 2.0
    sigma_T_K: 1.5
  feature_trend_match_weights:
    T_stable_K: 1.0
    t_cool_s: 4.0
    sigma_T_K: 2.0
  paired_generation: true
  latent_noise_scale: 0.1
  use_latent_stats: false
  num_generate_per_class: 250
