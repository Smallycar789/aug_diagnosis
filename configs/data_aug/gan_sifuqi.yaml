experiment:
  name: gan_sifuqi_v1
  seed: 42
  device: auto

output:
  root: outputs/data_aug

dataset:
  name: sifuqi
  root: data/sifuqi
  csv: servo_accuracy.csv
  time_column: hours
  value_columns:
    - servo_accuracy
  normal_time_max: 1000
  fault_time_min: 6000
  label_names:
    - normal
    - tracking_fault
  sample_length: 64
  stride: 16
  sample_rate: 1.0

model:
  name: gan
  z_dim: 64
  window_size: 64
  step_length: 16
  epochs: 120
  batch_size: 16
  g_lr: 0.0005
  d_lr: 5.0e-05
  enc_lr: 0.0003
  recon_weight: 0.5
  per_class: true
  per_class_norm: true
  num_generate_per_class: 300
  num_compare: 5
  split_feature_plots: true
  spectrum_plot_style: vline
