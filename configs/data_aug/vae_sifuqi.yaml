experiment:
  name: vae_sifuqi_v1
  seed: 42
  device: auto

output:
  root: outputs/data_aug

dataset:
  name: sifuqi
  root: data/sifuqi
  csv: servo_accuracy.csv
  time_column: hours
  value_columns:
    - servo_accuracy
  normal_time_max: 1000
  fault_time_min: 6000
  label_names:
    - normal
    - tracking_fault
  sample_length: 64
  stride: 16
  sample_rate: 1.0

model:
  name: gan_vae
  per_class: true
  seq_len: 64
  overlap_ratio: 0.5
  input_channels: 1
  latent_dim: 64
  epochs: 50
  batch_size: 32
  lr: 0.0001
  alpha: 0.01
  num_generate_per_class: 3000
