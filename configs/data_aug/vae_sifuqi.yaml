experiment:
  name: vae_sifuqi_v1
  seed: 42
  device: auto

output:
  root: outputs/data_aug

dataset:
  name: sifuqi
  root: data/sifuqi
  level: normal
  value_column: azimuth_error
  sample_rate: 100.0

model:
  name: vae
  input_dim: 1
  latent_dim: 64
  epochs: 50
  batch_size: 256
  lr: 0.01
  beta: 0.01
  num_generate: 6000
