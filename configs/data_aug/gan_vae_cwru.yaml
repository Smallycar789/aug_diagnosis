experiment:
  name: gan_vae_cwru_v1
  seed: 42
  device: auto

output:
  root: outputs/data_aug

dataset:
  name: cwru
  csv: data/CWRU/CWRU_12k_1797_10c.csv
  column_index: 0
  sample_rate: 12000

model:
  name: gan_vae
  seq_len: 128
  overlap_ratio: 0.5
  latent_dim: 64
  epochs: 50
  batch_size: 32
  lr: 0.0001
  alpha: 0.01
  num_generate: 100
