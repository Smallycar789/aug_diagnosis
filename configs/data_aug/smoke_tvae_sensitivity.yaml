experiment:
  name: smoke_tvae_sensitivity
  seed: 42
  device: auto

output:
  root: outputs/data_aug

dataset:
  name: sensitivity
  root: data/sensitivity
  class_files:
    normal: normal.csv
    sensitivity_degradation: sensitivity_degradation.csv
    coupled_severe_fault: coupled_severe_fault.csv
  value_columns:
    - avg_detectivity
    - NETD_mK
    - SiTF
    - signal_gain
    - read_noise_index
    - sensitivity_health
    - physical_degradation_index
  unit_column: unit
  cycle_column: cycle
  sample_length: 32
  stride: 32
  sample_rate: 1.0

model:
  name: tvae
  conditional: true
  seq_len: 32
  input_dim: 7
  label_embed_dim: 8
  latent_dim: 16
  hidden_dim: 32
  num_layers: 1
  epochs: 2
  batch_size: 32
  lr: 0.001
  phase1_tf_epochs: 1
  ramp_tfr_epochs: 1
  use_reference_kl_schedule: false
  beta_end: 0.01
  free_bits: 0.0
  tfr_min: 0.5
  openloop_aux_weight: 0.0
  dec_dropout: 0.0
  weight_decay: 0.0
  lr_patience: 3
  use_data_start: true
  num_generate_per_class: 5
