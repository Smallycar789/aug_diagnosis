experiment:
  name: tvae_degradation_fixed_v2
  seed: 42
  device: auto

output:
  root: outputs/data_aug

dataset:
  name: degradation
  root: data/degradation
  class_files:
    normal: normal.csv
    sensitivity_degradation: sensitivity_degradation.csv
    mtf_degradation: mtf_degradation.csv
    nonuniformity_degradation: nonuniformity_degradation.csv
    bad_pixel_degradation: bad_pixel_degradation.csv
    coupled_severe_fault: coupled_severe_fault.csv
  value_columns:
    - avg_detectivity
    - NETD_mK
    - SiTF
    - signal_gain
    - read_noise_index
  unit_column: unit
  cycle_column: cycle
  sample_length: 96
  stride: 32
  sample_rate: 1.0

model:
  name: tvae

  conditional: true
  per_class_norm: true

  seq_len: 96
  input_dim: 5

  epochs: 120

  batch_size: 32

  lr: 0.001

  latent_dim: 24
  hidden_dim: 128
  num_layers: 1
  latent_sampling_scale: 0.8
  label_embed_dim: 8

  free_bits: 0

  use_reference_kl_schedule: true

  beta_delay_frac: 0.50
  beta_end: 0.002

  phase1_tf_epochs: 40
  ramp_tfr_epochs: 40

  tfr_min: 0.5

  openloop_aux_weight: 1.5

  use_attention_encoder: false
  structured_decoder: false

  dec_dropout: 0.02
  weight_decay: 0.00001

  lr_patience: 15

  use_data_start: true

  num_generate_per_class: 300

  num_compare: 5

  split_feature_plots: false
  spectrum_plot_style: vline