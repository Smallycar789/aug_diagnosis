experiment:
  name: vae_degradation_v1
  seed: 42
  device: auto

output:
  root: outputs/data_aug

dataset:
  name: degradation
  root: data/DegradationData/fault_diagnosis
  value_column: NETD_mK
  sample_rate: 1.0

model:
  name: vae
  input_dim: 1
  latent_dim: 64
  epochs: 50
  batch_size: 256
  lr: 0.01
  beta: 0.01
  num_generate: 5000
