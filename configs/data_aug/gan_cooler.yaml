experiment:
  name: gan_cooler_v1
  seed: 42
  device: auto

output:
  root: outputs/data_aug

dataset:
  name: cooler
  root: data/cooler
  csv: cooler_simulation_results/all_simulation.csv
  value_column: T_stable_K
  sample_rate: 1.0

model:
  name: gan
  z_dim: 100
  window_size: 50
  overlap_ratio: 0.2
  epochs: 50
  batch_size: 64
  g_lr: 0.002
  d_lr: 0.0001
  enc_lr: 0.001
  num_generate: 100
