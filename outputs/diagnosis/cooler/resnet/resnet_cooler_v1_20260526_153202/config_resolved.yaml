experiment:
  name: resnet_cooler_v1
  seed: 42
  device: auto
output:
  root: outputs/diagnosis
dataset:
  name: cooler
  root: data/cooler
  head_csv: cooler_simulation_results/all_head_30.csv
  tail_csv: cooler_simulation_results/all_tail_30.csv
  value_columns:
  - T_stable_K
  - t_cool_hours
  - sigma_T_K
  sample_length: 30
  group_column: group_id
  cycle_column: work_cycle
  label_names:
  - normal
  - degraded
model:
  name: resnet
  sample_len: 90
  nperseg: 64
  noverlap: 32
  nfft: 224
  target_size: 224
  batch_size: 8
  epochs: 30
  lr: 0.001
  num_classes: 2
  train_ratio: 0.6
  val_ratio: 0.2
  freeze_layers: true
output_dir: /root/workspace/detect/outputs/diagnosis/cooler/resnet/resnet_cooler_v1_20260526_153202
