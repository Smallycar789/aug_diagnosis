experiment:
  name: cnn_bigru_cooler_v1
  seed: 42
  device: auto
output:
  root: outputs/diagnosis
dataset:
  name: cooler
  root: data/cooler
  simulation_csv: all_simulation.csv
  time_column: time_hours
  group_column: group_id
  value_columns:
  - T_stable_K
  - t_cool_s
  - sigma_T_K
  normal_time_max: 2000
  fault_time_min: 6000
  label_names:
  - normal
  - temperature_control_fault
  sample_length: 30
  stride: 15
  domain_adaptation: false
  normalize: global
  val_ratio: 0.15
  test_ratio: 0.15
model:
  name: cnn_bigru
  input_channels: 3
  num_classes: 2
  sample_length: 30
  hidden_dims: 64
  gru_hidden: 128
  num_layers: 2
  batch_size: 8
  epochs: 200
  alpha: 0
  lr: 0.001
  val_ratio: 0.15
