experiment:
  name: cnn_bigru_cooler_v1
  seed: 42
  device: auto
output:
  root: outputs/diagnosis
dataset:
  name: cooler
  root: data/cooler
  head_csv: cooler_simulation_results/all_head_30.csv
  tail_csv: cooler_simulation_results/all_tail_30.csv
  value_columns:
  - T_stable_K
  - t_cool_hours
  - sigma_T_K
  sample_length: 30
  group_column: group_id
  cycle_column: work_cycle
  label_names:
  - normal
  - degraded
  domain_adaptation: false
  normalize: global
  val_ratio: 0.15
  test_ratio: 0.15
model:
  name: cnn_bigru
  input_channels: 3
  num_classes: 2
  sample_length: 30
  hidden_dims: 64
  gru_hidden: 128
  num_layers: 2
  batch_size: 8
  epochs: 200
  alpha: 0
  lr: 0.001
  val_ratio: 0.15
output_dir: /root/workspace/detect/outputs/diagnosis/cooler/cnn_bigru/cnn_bigru_cooler_v1_20260526_151856
