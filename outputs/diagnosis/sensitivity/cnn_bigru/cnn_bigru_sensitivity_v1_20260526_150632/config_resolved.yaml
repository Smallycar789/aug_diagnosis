experiment:
  name: cnn_bigru_sensitivity_v1
  seed: 42
  device: auto
output:
  root: outputs/diagnosis
dataset:
  name: sensitivity
  root: data/sensitivity
  value_columns:
  - avg_detectivity
  - NETD_mK
  class_files:
    normal: normal.csv
    sensitivity_degradation: sensitivity_degradation.csv
    coupled_severe_fault: coupled_severe_fault.csv
  sample_length: 96
  stride: 32
  domain_adaptation: false
  normalize: global
  val_ratio: 0.15
  test_ratio: 0.15
model:
  name: cnn_bigru
  input_channels: 2
  num_classes: 3
  sample_length: 96
  hidden_dims: 128
  gru_hidden: 256
  num_layers: 2
  batch_size: 16
  epochs: 50
  alpha: 0
  lr: 0.0005
  val_ratio: 0.15
