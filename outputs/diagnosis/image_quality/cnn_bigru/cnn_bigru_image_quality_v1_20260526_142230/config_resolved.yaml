experiment:
  name: cnn_bigru_image_quality_v1
  seed: 42
  device: auto
output:
  root: outputs/diagnosis
dataset:
  name: image_quality
  root: data/image_quality
  value_columns:
  - MTF50
  - response_nonuniformity
  - bad_pixel_rate
  class_files:
    normal: normal.csv
    mtf_degradation: mtf_degradation.csv
    nonuniformity_degradation: nonuniformity_degradation.csv
    bad_pixel_degradation: bad_pixel_degradation.csv
    coupled_severe_fault: coupled_severe_fault.csv
  sample_length: 32
  stride: 16
  domain_adaptation: false
  normalize: global
  val_ratio: 0.15
  test_ratio: 0.15
model:
  name: cnn_bigru
  input_channels: 3
  num_classes: 5
  sample_length: 32
  hidden_dims: 64
  gru_hidden: 128
  num_layers: 2
  batch_size: 64
  epochs: 50
  alpha: 0
  lr: 0.0005
  val_ratio: 0.15
