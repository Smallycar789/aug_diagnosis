experiment:
  name: rvae_degradation_5feat_matvae_v8
  seed: 42
  device: auto
output:
  root: outputs/data_aug
dataset:
  name: degradation
  root: data/degradation
  class_files:
    normal: normal.csv
    sensitivity_degradation: sensitivity_degradation.csv
    mtf_degradation: mtf_degradation.csv
    nonuniformity_degradation: nonuniformity_degradation.csv
    bad_pixel_degradation: bad_pixel_degradation.csv
    coupled_severe_fault: coupled_severe_fault.csv
  value_columns:
  - avg_detectivity
  - NETD_mK
  - SiTF
  - signal_gain
  - read_noise_index
  unit_column: unit
  cycle_column: cycle
  sample_length: 96
  stride: 32
  sample_rate: 1.0
model:
  name: rvae
  conditional: true
  per_class_norm: true
  seq_len: 96
  input_dim: 5
  label_embed_dim: 8
  latent_dim: 32
  hidden_dim: 128
  num_layers: 1
  epochs: 200
  batch_size: 16
  lr: 0.001
  phase1_tf_epochs: 0
  ramp_tfr_epochs: 1
  use_reference_kl_schedule: true
  beta_delay_frac: 0.42
  beta_end: 0.04
  free_bits: 0.0
  tfr_min: 0.0
  openloop_aux_weight: 0.0
  dec_dropout: 0.05
  use_attention_encoder: true
  attention_heads: 8
  attention_layers: 1
  structured_decoder: true
  trend_degree: 2
  seasonal_periods:
  - 4
  - 8
  - 16
  - 32
  sample_decoder_output: true
  decoder_sample_scale: 0.35
  min_decoder_logvar: -9.0
  max_decoder_logvar: -5.0
  weight_decay: 1.0e-05
  lr_patience: 10
  use_data_start: false
  num_generate_per_class: 300
  num_compare: 5
  split_feature_plots: false
  spectrum_plot_style: vline
output_dir: /home/ze.qian/workspace/aug_diagnosis/outputs/data_aug/degradation/rvae/rvae_degradation_5feat_20260528_175809
